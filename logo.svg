<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Executive Royal Blue Gradient -->
    <linearGradient id="royalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Vibrant Gold Accents Gradient -->
    <linearGradient id="vibrantGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Metallic Silver Sheen Gradient -->
    <linearGradient id="metallicSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Presentation Canvas Background (Sophisticated Dark Slate) -->
  <rect width="512" height="512" rx="64" fill="#0b1329" />

  <!-- Geometric Outer Coin Chassis (Stylized Digital Coin Mechanism) -->
  <g filter="url(#softGlow)">
    <!-- Outer Precision Bezel -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="url(#royalBlue)" stroke-width="8" stroke-dasharray="24 12 8 12" opacity="0.85" />
    <circle cx="256" cy="256" r="178" fill="none" stroke="url(#metallicSilver)" stroke-width="2.5" opacity="0.4" />
    <circle cx="256" cy="256" r="164" fill="#0f172a" stroke="url(#metallicSilver)" stroke-width="5" />
  </g>

  <!-- Hexagonal Blockchain Node Mesh Infrastructure -->
  <g stroke="url(#metallicSilver)" stroke-width="3" opacity="0.45" fill="none">
    <!-- Top & Left Lattice Conduits -->
    <line x1="256" y1="132" x2="356" y2="190" />
    <line x1="356" y1="190" x2="356" y2="306" />
    <line x1="356" y1="306" x2="256" y2="364" />
    <line x1="256" y1="364" x2="156" y2="306" />
    <line x1="156" y1="306" x2="156" y2="190" />
    <line x1="156" y1="190" x2="256" y2="132" />

    <!-- Cross-Network Node Relays -->
    <line x1="156" y1="190" x2="256" y2="248" />
    <line x1="356" y1="190" x2="256" y2="248" />
    <line x1="256" y1="364" x2="256" y2="248" />
  </g>

  <!-- Blockchain Validation Vertices (Micro Nodes) -->
  <g fill="url(#metallicSilver)">
    <circle cx="156" cy="190" r="6" />
    <circle cx="356" cy="190" r="6" />
    <circle cx="156" cy="306" r="6" />
    <circle cx="356" cy="306" r="6" />
    <circle cx="256" cy="132" r="6" />
    <circle cx="256" cy="364" r="6" />
  </g>

  <!-- Dynamic Ascending Market Chart Trend Vector (Gold & Royal Blue Polyline) -->
  <g filter="url(#goldGlow)">
    <!-- Ascending Momentum Ribbon -->
    <path d="M 160 328 L 224 284 L 274 316 L 360 172" fill="none" stroke="url(#vibrantGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Fine Specular Highlight on Trendline -->
    <path d="M 160 328 L 224 284 L 274 316 L 360 172" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

    <!-- Breakout Apex Node (The High-Value Growth Signal) -->
    <polygon points="360,148 376,178 344,178" fill="url(#vibrantGold)" />
    <circle cx="360" cy="172" r="11" fill="url(#vibrantGold)" />
    <circle cx="360" cy="172" r="5" fill="#ffffff" />
  </g>

  <!-- Central Luminous Core: Stylized Digital Coin / Node Hub -->
  <g filter="url(#softGlow)">
    <!-- Base Core Tier -->
    <circle cx="256" cy="248" r="38" fill="url(#royalBlue)" stroke="url(#metallicSilver)" stroke-width="3.5" />
    
    <!-- Geometric Intersecting Facet -->
    <path d="M 230 248 L 256 220 L 282 248 L 256 276 Z" fill="url(#vibrantGold)" opacity="0.9" />

    <!-- Pure Light Reflection Point -->
    <circle cx="256" cy="248" r="6" fill="#ffffff" />
  </g>

  <!-- Discrete Market Impulse Bars (Subtle Lower Depth Indicator) -->
  <g fill="url(#royalBlue)" opacity="0.6">
    <rect x="200" y="340" width="8" height="18" rx="3" />
    <rect x="220" y="330" width="8" height="28" rx="3" />
    <rect x="240" y="322" width="8" height="36" rx="3" fill="url(#vibrantGold)" opacity="0.8" />
    <rect x="260" y="334" width="8" height="24" rx="3" />
    <rect x="280" y="318" width="8" height="40" rx="3" fill="url(#vibrantGold)" opacity="0.9" />
    <rect x="300" y="310" width="8" height="48" rx="3" fill="url(#vibrantGold)" />
  </g>
</svg>
